name: Release

# Task 5.4: tag-triggered release with one version source of truth.
# Pushing a tag (e.g. v3.0.0) runs the version-agreement check and, when
# every site matches the MDOCTOR_VERSION constant, produces a GitHub
# release — no manual file edit beyond the constant and the changelog.
on:
  push:
    tags:
      - 'v*.*.*'

# Release creation writes to the API; every other workflow stays read-only.
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version check reads the constant at the pushed tag; tags
          # must be present (same flag as the release-sanity job).
          fetch-tags: true

      # Fails when any of the six version sites disagrees with the
      # MDOCTOR_VERSION constant (proven by a deliberate mismatch:
      # ./scripts/check_version.sh v9.9.9 exits 1). The tag itself must
      # equal "v${MDOCTOR_VERSION}".
      - name: Check version agreement (Task 5.4)
        run: ./scripts/check_version.sh "${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping create."
          else
            gh release create "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "mdoctor $tag" \
              --notes-file docs/CHANGELOG.md
          fi
