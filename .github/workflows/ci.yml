name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Task 2.6: least privilege (no job writes to the API) and one active
# run per ref (a second push cancels the first).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04 # Task 2.4: pinned image
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same ShellCheck as the pre-commit hook (Task 2.3: one version
      # string, 0.11.0.1, in both files).
      - name: Install ShellCheck 0.11.0.1
        run: pipx install 'shellcheck-py==0.11.0.1'

      - name: Run ShellCheck policy linter
        run: |
          chmod +x scripts/lint_shell.sh
          ./scripts/lint_shell.sh

      # The bash-syntax sweep lives in scripts/lint_shell.sh (Task 2.2:
      # single discovery source) — invoke it, don't duplicate its find.
      - name: Check bash syntax for all scripts
        run: ./scripts/lint_shell.sh

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04 # Task 2.4: pinned image
    timeout-minutes: 10
    needs: lint

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history: a pushed secret fails even in an old commit

      # Same scanner as the pre-commit hook (Task 3.5: gitleaks 8.30.1).
      - name: Install gitleaks 8.30.1
        run: |
          curl -sL --max-time 120 "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks version

      - name: Scan history for secrets
        run: /tmp/gitleaks detect --source . --verbose

  test:
    name: Test (macOS)
    runs-on: macos-26 # Task 2.4: pinned image
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make scripts executable
        run: chmod +x mdoctor doctor.sh cleanup.sh tests/run.sh tests/test_*.sh tests/helpers/assert.sh

      - name: Run shell regression harness
        timeout-minutes: 10
        run: ./tests/run.sh

      - name: mdoctor help
        run: ./mdoctor help

      - name: mdoctor version
        run: ./mdoctor version

      - name: mdoctor info
        run: ./mdoctor info

      - name: mdoctor check (full health audit)
        run: ./mdoctor check

      - name: mdoctor clean (dry-run)
        run: ./mdoctor clean

      - name: mdoctor check single module
        run: ./mdoctor check -m network

  test-linux:
    name: Test (Linux/Ubuntu)
    runs-on: ubuntu-24.04 # Task 2.4: pinned image
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make scripts executable
        run: chmod +x mdoctor doctor.sh cleanup.sh tests/run.sh tests/test_*.sh tests/helpers/assert.sh tests/helpers/bin/* tests/helpers/bin-macos/*

      - name: Record pre-suite host state (Task 1.7)
        run: |
          docker volume ls -q 2>/dev/null | wc -l > /tmp/volumes_before.txt || echo 0 > /tmp/volumes_before.txt
          dpkg-query -W -f='${Status}\n' 2>/dev/null | grep -c "install ok installed" > /tmp/pkgs_before.txt || echo 0 > /tmp/pkgs_before.txt

      - name: Run shell regression harness
        run: |
          set -o pipefail
          timeout 300 ./tests/run.sh 2>&1 | tee /tmp/baseline-green.txt

      - name: Assert no external state destroyed (Task 1.7)
        run: |
          set -euo pipefail
          before_v="$(cat /tmp/volumes_before.txt)"
          after_v="$(docker volume ls -q 2>/dev/null | wc -l)"
          [ "$before_v" = "$after_v" ] || { echo "Docker volumes changed: $before_v -> $after_v"; exit 1; }
          before_p="$(cat /tmp/pkgs_before.txt)"
          after_p="$(dpkg-query -W -f='${Status}\n' | grep -c "install ok installed")"
          [ "$before_p" = "$after_p" ] || { echo "Installed packages changed: $before_p -> $after_p"; exit 1; }
          echo "No Docker volume removed; no package autoremoved."

      - name: Record baseline-green in job summary (Task 1.7)
        if: always()
        run: |
          summary="$(grep -E "Test summary:" /tmp/baseline-green.txt || echo "Test summary: suite did not complete")"
          {
            echo "## Baseline-green (Task 1.7)"
            echo ""
            echo "From a clean checkout, \`./tests/run.sh\`: **${summary}**"
            echo ""
            echo "External-state guard: no Docker volume removed, no package autoremoved."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: mdoctor help
        run: ./mdoctor help

      - name: mdoctor version
        run: ./mdoctor version

      - name: mdoctor info
        run: ./mdoctor info

      - name: mdoctor check single module (system)
        run: timeout 60 ./mdoctor check -m system

      - name: mdoctor clean (dry-run)
        run: timeout 120 ./mdoctor clean

      - name: mdoctor list
        run: ./mdoctor list

  test-bash32:
    name: Test (Bash 3.2 compat)
    runs-on: ubuntu-24.04 # Task 2.4: pinned image
    timeout-minutes: 15
    needs: lint
    container:
      image: bash@sha256:3a13e5da38baa575985778cd09ce8ac736d4b4dafc91a430e71271f6e5311b89 # bash:3.2

    steps:
      - name: Install git and nodejs for checkout
        run: apk add --no-cache git nodejs

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run test suite under Bash 3.2
        run: timeout 300 bash ./tests/run.sh

  release-sanity:
    name: Release Sanity
    timeout-minutes: 10
    runs-on: macos-26 # Task 2.4: pinned image
    needs: [lint, test, test-linux]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make install scripts executable
        run: chmod +x install.sh uninstall.sh

      - name: Installer/uninstaller isolated-path sanity
        run: |
          set -euo pipefail

          TMP_ROOT="$(mktemp -d)"
          TMP_INSTALL="$TMP_ROOT/install"
          TMP_BIN="$TMP_ROOT/bin"
          mkdir -p "$TMP_BIN"

          # Task 4.2: the installer refuses symlink creation on a non-tty
          # without an explicit opt-in — same ASSUME_YES as uninstall below.
          MDOCTOR_REPO_URL="$PWD" \
          MDOCTOR_INSTALL_DIR="$TMP_INSTALL" \
          MDOCTOR_BIN_DIR="$TMP_BIN" \
          MDOCTOR_BINARY_NAME="mdoctor" \
          MDOCTOR_ASSUME_YES=true \
          ./install.sh

          "$TMP_BIN/mdoctor" version
          "$TMP_BIN/mdoctor" help >/dev/null

          MDOCTOR_INSTALL_DIR="$TMP_INSTALL" \
          MDOCTOR_BIN_LINK="$TMP_BIN/mdoctor" \
          MDOCTOR_ASSUME_YES=true \
          ./uninstall.sh

          test ! -e "$TMP_BIN/mdoctor"
