name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Task 2.6: least privilege (no job writes to the API) and one active
# run per ref (a second push cancels the first).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Task 5.2 (W4): actions/checkout is pinned to the v7.0.1 commit SHA on all
# six refs. v5.0.0 set a minimum compatible runner version of v2.327.1;
# immaterial here because every job uses a GitHub-hosted runner (always at
# or above that version) — asserted by the 'No self-hosted runners' step
# in the lint job. Whoever adds a self-hosted runner later must keep it
# at or above v2.327.1. No input renamed or removed across v5/v6/v7 is in
# use (the only non-default input is `fetch-tags: true`, still valid in v7).

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04 # Task 2.4: pinned image
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No self-hosted runners (Task 5.2 runner floor v2.327.1)
        # Every job uses a GitHub-hosted runner, so v5.0.0's minimum
        # runner version (v2.327.1) is always satisfied. The pattern is
        # built in two halves so this very step never matches itself.
        run: |
          pat='runs-on:'
          pat="${pat}.*self-hosted"
          test "$(grep -c "$pat" .github/workflows/ci.yml || true)" = "0"

      # Same ShellCheck as the pre-commit hook (Task 2.3: one version
      # string, 0.11.0.1, in both files).
      - name: Install ShellCheck 0.11.0.1
        run: pipx install 'shellcheck-py==0.11.0.1'

      - name: Run ShellCheck policy linter
        run: ./scripts/lint_shell.sh

      # The bash-syntax sweep lives in scripts/lint_shell.sh (Task 2.2:
      # single discovery source) — invoke it, don't duplicate its find.
      - name: Check bash syntax for all scripts
        run: ./scripts/lint_shell.sh

      # Task 5.1 (W3): Bash 3.2 floor policy check. Also runs inside
      # lint_shell.sh above; kept as an explicit step so the policy
      # gate is visible in the job log.
      - name: Check Bash 3.2 banned constructs
        run: ./scripts/check_bash32.sh

  hooks:
    name: Hooks (pre-commit)
    runs-on: ubuntu-24.04 # Task 2.4: pinned image
    timeout-minutes: 10
    needs: lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Task 2.8: the hooks run in CI on every file. Executable bits come
      # from git, never from chmod steps (removed) — a missing +x fails
      # the check-shebang-scripts-are-executable hook loudly.
      # Task 5.3 (W5): pre-commit-hooks v6.0.0 requires Python >= 3.9.
      - name: Assert Python >= 3.9 (Task 5.3 hook floor)
        run: python3 -c 'import sys; assert sys.version_info >= (3,9)'

      - name: Run pre-commit on all files
        run: |
          pipx install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (macOS)
    runs-on: macos-26 # Task 2.4: pinned image
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Task 6.2: tests/run.sh wraps each .bats file in a timeout watchdog;
      # macOS runners ship no GNU timeout. Expose ONLY gtimeout as `timeout`
      # — putting all of coreutils' gnubin on PATH would shadow the BSD
      # stat/realpath the product (and these tests) rely on.
      - name: Install GNU timeout (coreutils, timeout only)
        run: |
          brew install coreutils
          mkdir -p "$RUNNER_TEMP/ci-timeout-bin"
          ln -sf "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/ci-timeout-bin/timeout"
          echo "$RUNNER_TEMP/ci-timeout-bin" >> "$GITHUB_PATH"

      - name: Run shell regression harness
        timeout-minutes: 10
        run: ./tests/run.sh

      - name: mdoctor help
        run: ./mdoctor help

      - name: mdoctor version
        run: ./mdoctor version

      - name: mdoctor info
        run: ./mdoctor info

      - name: mdoctor check (full health audit)
        run: ./mdoctor check

      - name: mdoctor clean (dry-run)
        run: ./mdoctor clean

      - name: mdoctor check single module
        run: ./mdoctor check -m network

  test-linux:
    name: Test (Linux/Ubuntu)
    runs-on: ubuntu-24.04 # Task 2.4: pinned image
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record pre-suite host state (Task 1.7)
        run: |
          docker volume ls -q 2>/dev/null | wc -l > /tmp/volumes_before.txt || echo 0 > /tmp/volumes_before.txt
          dpkg-query -W -f='${Status}\n' 2>/dev/null | grep -c "install ok installed" > /tmp/pkgs_before.txt || echo 0 > /tmp/pkgs_before.txt

      - name: Run shell regression harness
        run: |
          set -o pipefail
          timeout 300 ./tests/run.sh 2>&1 | tee /tmp/baseline-green.txt

      - name: Assert no external state destroyed (Task 1.7)
        run: |
          set -euo pipefail
          before_v="$(cat /tmp/volumes_before.txt)"
          after_v="$(docker volume ls -q 2>/dev/null | wc -l)"
          [ "$before_v" = "$after_v" ] || { echo "Docker volumes changed: $before_v -> $after_v"; exit 1; }
          before_p="$(cat /tmp/pkgs_before.txt)"
          after_p="$(dpkg-query -W -f='${Status}\n' | grep -c "install ok installed")"
          [ "$before_p" = "$after_p" ] || { echo "Installed packages changed: $before_p -> $after_p"; exit 1; }
          echo "No Docker volume removed; no package autoremoved."

      - name: Record baseline-green in job summary (Task 1.7)
        if: always()
        run: |
          summary="$(grep -E "Test summary:" /tmp/baseline-green.txt || echo "Test summary: suite did not complete")"
          {
            echo "## Baseline-green (Task 1.7)"
            echo ""
            echo "From a clean checkout, \`./tests/run.sh\`: **${summary}**"
            echo ""
            echo "External-state guard: no Docker volume removed, no package autoremoved."
          } >> "$GITHUB_STEP_SUMMARY"

      # Task 6.2: render JUnit results as per-test annotations and keep the
      # raw report as an artifact. Zero new third-party actions — the
      # annotation emitter is a stdlib-only XML walk.
      - name: Emit per-test failure annotations (Task 6.2)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET
          paths = glob.glob("test-results/junit.xml")
          if not paths:
              print("::warning::no JUnit report produced by tests/run.sh")
              raise SystemExit(0)
          root = ET.parse(paths[0]).getroot()
          for case in root.iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  continue
              name = case.get("name", "?").replace("%", "%25")
              classname = case.get("classname", "")
              msg = (failure.get("message") or failure.text or "test failed").strip().splitlines()[0][:200]
              print(f"::error title={classname} › {name}::{msg}")
          print(f"JUnit report: {sum(1 for _ in root.iter('testcase'))} testcases parsed")
          PY

      - name: Upload JUnit report (Task 6.2)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-report
          path: test-results/junit.xml
          if-no-files-found: ignore

      - name: mdoctor help
        run: ./mdoctor help

      - name: mdoctor version
        run: ./mdoctor version

      - name: mdoctor info
        run: ./mdoctor info

      - name: mdoctor check single module (system)
        run: timeout 60 ./mdoctor check -m system

      - name: mdoctor clean (dry-run)
        run: timeout 120 ./mdoctor clean

      - name: mdoctor list
        run: ./mdoctor list

  test-bash32:
    name: Test (Bash 3.2 compat)
    runs-on: ubuntu-24.04 # Task 2.4: pinned image
    timeout-minutes: 15
    needs: lint
    container:
      image: bash@sha256:3a13e5da38baa575985778cd09ce8ac736d4b4dafc91a430e71271f6e5311b89 # bash:3.2

    steps:
      - name: Install git and nodejs for checkout
        run: apk add --no-cache git nodejs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run test suite under Bash 3.2
        run: timeout 300 bash ./tests/run.sh

  coverage:
    # Task 6.1 (F-TEST-004 / M3): bash coverage with kcov on the Linux lane.
    # kcov is absent from the Ubuntu 24.04 package archive, so it is built
    # from a pinned v43 source checkout. The HTML report is uploaded as the
    # `coverage` artifact, the job summary records the M3 baseline percentage,
    # and a floor (COVERAGE_MIN, ratcheted from that baseline) fails the job
    # before the number can silently regress.
    name: Coverage (kcov)
    runs-on: ubuntu-24.04 # Task 2.4: pinned image
    timeout-minutes: 30
    needs: lint
    env:
      # M3 coverage ratchet (Task 6.1): the first kcov baseline measured
      # 60.87% on 2026-09-08 (2483/4079 lines across 42 product files,
      # tests/ excluded from the report). Keep this at or just below the
      # recorded baseline so the number cannot silently regress.
      COVERAGE_MIN: "55"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build kcov v43 from source (pinned)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-dev build-essential cmake libssl-dev \
            libcurl4-openssl-dev libelf-dev zlib1g-dev libdw-dev libiberty-dev
          git clone --filter=blob:none https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
          git -C /tmp/kcov-src checkout a39874f938ce13f7a65f253120d1ec946b349ffe # v43
          cmake -S /tmp/kcov-src -B /tmp/kcov-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-build -j"$(nproc)"
          sudo cmake --install /tmp/kcov-build

      - name: Run test suite under kcov
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coverage"
          kcov \
            --bash-parser="$(command -v bash)" \
            --include-path="$PWD" \
            --exclude-pattern=/tests/ \
            --clean \
            "$RUNNER_TEMP/coverage" \
            ./tests/run.sh

      - name: Report coverage and enforce the M3 ratchet
        run: |
          set -euo pipefail
          report="$(find "$RUNNER_TEMP/coverage" -maxdepth 2 -name coverage.json | head -1)"
          test -n "$report" || { echo "✗ no kcov coverage.json produced"; exit 1; }
          pct="$(python3 -c 'import json, sys; print(float(json.load(open(sys.argv[1]))["percent_covered"]))' "$report")"
          covered="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["covered_lines"])' "$report")"
          total="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["total_lines"])' "$report")"
          echo "kcov report: $report"
          {
            echo "## Coverage (Task 6.1 — M3 baseline)"
            echo ""
            echo "Suite run under \`kcov\` on the Linux lane: **${pct}%** covered"
            echo "("${covered}"/"${total}" lines, report: \`${report}\`)."
            echo ""
            echo "Ratchet floor: **${COVERAGE_MIN}%** (\`COVERAGE_MIN\`, just below the recorded baseline)."
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - "$pct" "$COVERAGE_MIN" <<'PY'
          import sys
          measured, floor = float(sys.argv[1]), float(sys.argv[2])
          if measured < floor:
              print(f"✗ Coverage {measured:.2f}% below the {floor:.1f}% ratchet floor")
              sys.exit(1)
          print(f"✓ Coverage {measured:.2f}% meets the {floor:.1f}% ratchet floor")
          PY

      - name: Upload kcov HTML report (Task 6.1)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
          if-no-files-found: error

  release-sanity:
    name: Release Sanity
    timeout-minutes: 10
    runs-on: macos-26 # Task 2.4: pinned image
    needs: [lint, test, test-linux]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Task 4.1: the stable-channel installer resolves the newest
          # vX.Y.Z tag at the remote — tags must be present or the
          # sanity install fails with "No release tags found".
          fetch-tags: true

      # The checkout above fetches a single merge ref; make sure the
      # release tags are present regardless of checkout flag quirks.
      - name: Fetch release tags for stable-channel install
        run: git fetch --depth=1 origin "+refs/tags/v*:refs/tags/v*"

      - name: Installer/uninstaller isolated-path sanity
        run: |
          set -euo pipefail

          TMP_ROOT="$(mktemp -d)"
          TMP_INSTALL="$TMP_ROOT/install"
          TMP_BIN="$TMP_ROOT/bin"
          mkdir -p "$TMP_BIN"

          # Task 4.2: the installer refuses symlink creation on a non-tty
          # without an explicit opt-in — same ASSUME_YES as uninstall below.
          MDOCTOR_REPO_URL="$PWD" \
          MDOCTOR_INSTALL_DIR="$TMP_INSTALL" \
          MDOCTOR_BIN_DIR="$TMP_BIN" \
          MDOCTOR_BINARY_NAME="mdoctor" \
          MDOCTOR_ASSUME_YES=true \
          ./install.sh

          "$TMP_BIN/mdoctor" version
          "$TMP_BIN/mdoctor" help >/dev/null

          MDOCTOR_INSTALL_DIR="$TMP_INSTALL" \
          MDOCTOR_BIN_LINK="$TMP_BIN/mdoctor" \
          MDOCTOR_ASSUME_YES=true \
          ./uninstall.sh

          test ! -e "$TMP_BIN/mdoctor"
