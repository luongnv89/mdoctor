# Dependabot keeps pinned Actions refs and pre-commit hooks current
# (Task 1.5). SHA pins in .github/workflows/ci.yml stay exact — Dependabot
# updates the SHA and the trailing version comment together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
